<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>確定申告の下書き</title>
<style>
  body { margin: 0; padding: 1rem; background: #f1f7f5; color: #152b29; font: 1rem/1.5 system-ui, sans-serif; }
  main { padding: 1rem; border: 1px solid #a9c2bd; border-radius: .75rem; background: #fff; }
  h1 { margin: 0; font-size: 1.25rem; }
  button { min-height: 2.75rem; border: 0; border-radius: .5rem; padding: .5rem 1rem; background: #005d51; color: #fff; font: inherit; }
  button:focus-visible { outline: 3px solid #935800; outline-offset: 2px; }
  button:disabled { opacity: .6; }
</style>
<main>
  <h1>確定申告の下書き</h1>
  <p id="status" role="status">ホストに接続しています。</p>
  <p>本人が手動で提出します。</p>
  <button id="refresh" type="button" hidden></button>
</main>
<script>
  "use strict";
  const protocolVersion = "2026-01-26";
  const status = document.getElementById("status");
  const refresh = document.getElementById("refresh");
  const parentWindow = window.parent;
  let hostOrigin;
  let nextId = 1;
  let pendingRefresh;
  let readOperation;
  let canCallTools = false;

  function send(payload) {
    parentWindow.postMessage({ jsonrpc: "2.0", ...payload }, !hostOrigin || hostOrigin === "null" ? "*" : hostOrigin);
  }

  function show(result) {
    if (!result || result.isError) {
      status.textContent = "状態を読み込めませんでした。";
      return;
    }
    const snapshot = result.structuredContent;
    const state = snapshot?.state;
    if (state?.["submission-status"] !== "user-manual-required") return;
    const step = snapshot.steps?.find(item => item.id === state.step)?.label;
    readOperation = snapshot.operations?.find(op => op.id === "taxreturn.read_state" && op.mode === "read");
    const draft = snapshot.output?.estimate === undefined ? state.draft : snapshot.output;
    status.textContent = draft
      ? `${draft.year}年分 · ${step || "下書き"} · 税額の概算 ${draft.estimate.toLocaleString("ja-JP")} 円`
      : step || "下書きの準備中";
    refresh.hidden = !canCallTools || !readOperation;
    if (readOperation) refresh.textContent = readOperation.label;
  }

  refresh.addEventListener("click", () => {
    if (!hostOrigin || !canCallTools || !readOperation || pendingRefresh) return;
    pendingRefresh = nextId++;
    refresh.disabled = true;
    send({ id: pendingRefresh, method: "tools/call", params: { name: readOperation.id, arguments: {} } });
  });

  if (parentWindow !== window) {
    const initId = nextId++;
    window.addEventListener("message", event => {
      const message = event.data;
      if (event.source !== parentWindow || message?.jsonrpc !== "2.0" ||
          (hostOrigin && event.origin !== hostOrigin)) return;
      if (!hostOrigin && message.id === initId) {
        if (message.result?.protocolVersion !== protocolVersion) {
          status.textContent = "標準MCPの構造化結果を確認してください。";
          return;
        }
        hostOrigin = event.origin;
        canCallTools = Boolean(message.result.hostCapabilities?.serverTools);
        status.textContent = "状態を読み込んでいます。";
        send({ method: "ui/notifications/initialized", params: {} });
      } else if (hostOrigin && message.method === "ui/notifications/tool-result") {
        show(message.params);
      } else if (hostOrigin && pendingRefresh && message.id === pendingRefresh) {
        pendingRefresh = undefined;
        refresh.disabled = false;
        show(message.result);
      }
    });
    send({ id: initId, method: "ui/initialize", params: {
      protocolVersion, appInfo: { name: "kaikei-taxreturn", version: "0.1.0" },
      appCapabilities: { availableDisplayModes: ["inline"] }
    } });
  } else {
    status.textContent = "MCPホストの埋め込み画面です。";
  }
</script>
</html>
