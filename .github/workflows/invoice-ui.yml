name: Otehon invoice UI addon
on:
  pull_request:
    paths:
      - otehon/**
      - scripts/build-site.cljk
      - .github/workflows/invoice-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-addon:
    # Private source key is available only to reviewed owner-authored refs.
    if: >-
      ${{ github.actor == 'com-junkawasaki' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == 'com-junkawasaki')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require least-privilege access to owning private UI source
        env:
          UI_SOURCE_SSH_KEY: ${{ secrets.AWAI_INVOICE_UI_SOURCE_SSH_KEY_2986 }}
        run: |
          if [ -z "$UI_SOURCE_SSH_KEY" ]; then
            echo '::error::Configure AWAI_INVOICE_UI_SOURCE_SSH_KEY_2986 with a read-only apex deploy key for network-awai/network-awai-apex only. No build was qualified.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ssh-key: ${{ secrets.AWAI_INVOICE_UI_SOURCE_SSH_KEY_2986 }}
          repository: network-awai/network-awai-apex
          ref: 02748d4073ace4366c6b7c39f2600345d845c92e
          path: .agent-output/ui-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kotoba-lang/kotoba
          ref: b7d31a1ee3aafdb4c33dd9f7d6b94ae423393b64
          path: .agent-output/canonical
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NixOS/nixpkgs
          ref: f5c082a40f7571c266e74e80ae2e68aadd8a9fc7
          path: .agent-output/nixpkgs
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - name: Pin Otehon build tools
        run: |
          runtime=$(nix-build .agent-output/ui-source/ci/wnfs-cljc-runtime.nix --arg nixpkgsPath ./.agent-output/nixpkgs --no-out-link)
          echo "$runtime/bin" >> "$GITHUB_PATH"
      - name: Install shared integrity-locked UI dependencies
        run: npm ci --ignore-scripts --prefix .agent-output/ui-source/otehon/invoice-ui
      - name: Prepare explicit static artifact fixture
        run: |
          mkdir -p .agent-output/product
          node -e 'require("node:fs").writeFileSync(".agent-output/product/index.html", "<!doctype html><html><head><title>Addon build fixture</title></head><body><div id=app>Existing product</div></body></html>")'
      - name: Verify owning static addon build hook
        run: node otehon/build-invoice-ui.mjs .agent-output/ui-source .agent-output/canonical .agent-output/product
